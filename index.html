<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Teslim Tarihi Takip</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F2F5;color:#1a1a2e;font-size:14px}
:root{--navy:#1B2E5E;--navy2:#243b78;--orange:#E8732A;--orange2:#d4621c;--green:#16a34a;--red:#dc2626;--amber:#f59e0b;--gray:#64748B;--lgray:#94A3B8;--border:#E2E8F0;--white:#fff}

/* HEADER */
header{background:var(--navy);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo{height:26px}
.hdr-actions{display:flex;align-items:center;gap:8px}
.hdr-btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;color:rgba(255,255,255,.75);background:rgba(255,255,255,.1);transition:.15s}
.hdr-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.hdr-btn.active{background:var(--orange);color:#fff}

/* LAYOUT */
.page{min-height:calc(100vh - 52px);padding:20px}
.max{max-width:1200px;margin:0 auto}

/* CARDS */
.card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card-body{padding:16px}

/* STATS ROW */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:.15s;border-left:4px solid transparent}
.stat:hover{border-color:var(--orange);transform:translateY(-1px)}
.stat.active{border-left-color:var(--orange);background:#fffaf7}
.stat-val{font-size:28px;font-weight:800;line-height:1}
.stat-lbl{font-size:11px;color:var(--lgray);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.c-navy{color:var(--navy)}.c-green{color:var(--green)}.c-red{color:var(--red)}.c-amber{color:var(--amber)}.c-orange{color:var(--orange)}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:200px}
.search-box input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;outline:none;transition:.15s}
.search-box input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,115,42,.1)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--lgray);font-size:14px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange2)}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy2)}
.btn-ghost{background:#fff;color:var(--gray);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--navy);color:var(--navy)}
.btn-red{background:#fee2e2;color:var(--red)}.btn-red:hover{background:#fecaca}
.btn-green{background:#dcfce7;color:var(--green)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 12px;background:#F8FAFC;color:var(--gray);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:8px 12px;border-top:1px solid #F1F5F9;color:var(--navy);vertical-align:middle}
tr:hover td{background:#FAFBFF}
tr.late td{background:#FFF5F5}
tr.late:hover td{background:#FEE2E2}
tr.done td{background:#F0FDF4}
.mono{font-family:monospace;font-size:11px}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap}
.b-green{background:#dcfce7;color:#166534}.b-red{background:#fee2e2;color:#991b1b}
.b-amber{background:#fef3c7;color:#92400e}.b-blue{background:#dbeafe;color:#1e40af}
.b-gray{background:#f1f5f9;color:var(--gray)}.b-acil{background:var(--red);color:#fff}
.b-navy{background:#e8edf7;color:var(--navy)}

/* PROGRESS */
.prog{height:4px;background:#E8EDF7;border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle}
.prog-bar{height:100%;border-radius:99px}

/* CHECKBOX */
input[type=checkbox]{width:15px;height:15px;accent-color:var(--orange);cursor:pointer}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-hdr h3{font-size:14px;font-weight:700}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-ftr{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.mail-preview{background:#F8FAFC;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;line-height:1.7;white-space:pre-wrap;max-height:280px;overflow-y:auto}
.field-lbl{font-size:10px;font-weight:700;color:var(--lgray);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px;margin-top:10px}
.field-lbl:first-child{margin-top:0}

/* FORM INPUTS */
input[type=text],input[type=date],input[type=password],textarea,select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:var(--navy);outline:none;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,115,42,.1)}
input:disabled{background:#F8FAFC;color:var(--gray)}
.lbl{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px}

/* ALERT */
.alert{padding:10px 14px;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.alert-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.alert-err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.alert-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}

/* UPLOAD */
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:.2s}
.upload-zone:hover{border-color:var(--orange);background:#fffaf8}

/* WARNING BANNER */
.warn-banner{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.warn-banner ul{margin:4px 0 0 16px}
.warn-banner li{font-size:12px;color:#92400e;margin-top:2px}

/* SUPPLIER FORM */
.sup-header{background:var(--navy);color:#fff;padding:14px 20px;border-radius:10px;margin-bottom:16px}
.order-tbl-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;background:#fff}

/* DARK PAGE */
.dark-page{min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:24px}

/* RESPONSIVE */
@media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{flex-direction:column;align-items:stretch}}

/* MISC */
.hidden{display:none!important}
.space-y>*+*{margin-top:10px}
.flex{display:flex;align-items:center}.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.flex-1{flex:1}.min-w-0{min-width:0}.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fw6{font-weight:600}.fw7{font-weight:700}.fw8{font-weight:800}
.text-xs{font-size:11px}.text-sm{font-size:13px}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
</style>
</head>

<script>
const SB_URL = "https://hmlxxeuxzakguhlmpyla.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtbHh4ZXV4emFrZ3VobG1weWxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMjM4NDksImV4cCI6MjA5ODg5OTg0OX0.NvIrQeeqWS-cXdsOe3cwkGdBk2ZBRWTGcWyyAYJ8N40";
const H = {"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};

async function sbGet(path) {
  const r = await fetch(SB_URL+"/rest/v1/"+path, {headers:H});
  if(!r.ok) throw new Error(await r.text());
  const t = await r.text(); return t ? JSON.parse(t) : [];
}
async function sbPost(path, body, extra) {
  const r = await fetch(SB_URL+"/rest/v1/"+path, {method:"POST", headers:Object.assign({},H,{"Prefer":"return=minimal"},extra||{}), body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
}
async function sbPatch(path, body) {
  const r = await fetch(SB_URL+"/rest/v1/"+path, {method:"PATCH", headers:Object.assign({},H,{"Prefer":"return=minimal"}), body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
}
async function sbDelete(path) {
  const r = await fetch(SB_URL+"/rest/v1/"+path, {method:"DELETE", headers:Object.assign({},H,{"Prefer":"return=minimal"})});
  if(!r.ok) throw new Error(await r.text());
}
async function sbUpsert(path, body) {
  await sbPost(path, body, {"Prefer":"resolution=merge-duplicates,return=minimal"});
}

// DATA LAYER
async function getOrders() {
  const rows = await sbGet("siparisler?select=*&order=ted_no,talep_no");
  return (rows||[]).map(r=>({
    id:r.id, talepTipi:r.talep_tipi, talepNo:r.talep_no, strNo:r.str_no,
    malzKodu:r.malz_kodu, malzTanim:r.malz_tanim, origQty:r.orig_qty,
    bagMiktar:r.bag_miktar, sozTarih:r.soz_tarih, tedNo:r.ted_no,
    tedUnvan:r.ted_unvan, acil:r.acil
  }));
}
async function uploadOrders(rows) {
  await sbDelete("siparisler?id=neq.NONE");
  const mapped = rows.map(r=>({
    id:r.id, talep_tipi:r.talepTipi, talep_no:r.talepNo, str_no:r.strNo,
    malz_kodu:r.malzKodu, malz_tanim:r.malzTanim, orig_qty:r.origQty,
    bag_miktar:r.bagMiktar, soz_tarih:r.sozTarih, ted_no:r.tedNo,
    ted_unvan:r.tedUnvan, acil:r.acil||false
  }));
  for(let i=0;i<mapped.length;i+=100) await sbPost("siparisler", mapped.slice(i,i+100));
  await setAyar("uploadedAt", new Date().toISOString().slice(0,10));
}
async function setAcil(id, acil) { await sbPatch("siparisler?id=eq."+encodeURIComponent(id), {acil}); }

async function getResponses() {
  const rows = await sbGet("yanıtlar?select=*");
  const m={};
  (rows||[]).forEach(r=>{m[r.siparis_id]={yeniTarih:r.yeni_tarih, not:r.not_, savedAt:r.saved_at, adminNot:r.admin_not||""};});
  return m;
}
async function saveResponse(id, yeniTarih, not_) {
  await sbUpsert("yanıtlar", {id, siparis_id:id, yeni_tarih:yeniTarih, not_:not_, saved_at:new Date().toISOString()});
}
async function saveAdminNot(id, adminNot) {
  await sbUpsert("yanıtlar", {id, siparis_id:id, admin_not:adminNot});
}

async function getSuppliers() {
  const rows = await sbGet("tedarikciler?select=*&order=ted_unvan");
  const m={};
  (rows||[]).forEach(r=>{m[r.ted_no]={tedNo:r.ted_no, name:r.ted_unvan, mail:r.mail, skor:r.skor||100};});
  return m;
}
async function upsertSupplier(tedNo, name, mail) {
  await sbUpsert("tedarikciler", {ted_no:tedNo, ted_unvan:name, mail});
}
async function deleteSupplier(tedNo) { await sbDelete("tedarikciler?ted_no=eq."+encodeURIComponent(tedNo)); }

async function getAyar(key) {
  const r = await sbGet("ayarlar?key=eq."+encodeURIComponent(key)+"&select=value");
  return r&&r.length ? r[0].value : null;
}
async function setAyar(key, value) { await sbUpsert("ayarlar", {key, value}); }

async function getMailLog() {
  const rows = await sbGet("mail_log?select=*&order=sent_at.desc");
  return rows||[];
}
async function logMail(tedNo, tedUnvan, tip, no) {
  await sbPost("mail_log", {ted_no:tedNo, ted_unvan:tedUnvan, mail_tipi:tip, hatirlatma_no:no||1});
}
</script>

function serialToISO(v) {
  if(!v && v!==0) return "";
  if(typeof v==="number" && v>1) {
    const s=v>59?v:v+1;
    const d=new Date(new Date(Date.UTC(1899,11,30)).getTime()+s*86400000);
    return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");
  }
  if(typeof v==="string"){
    if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10);
    if(/^\d{2}\.\d{2}\.\d{4}/.test(v)){const p=v.split(".");return p[2]+"-"+p[1]+"-"+p[0];}
  }
  return "";
}
function fmtDate(iso){
  if(!iso) return "—";
  const p=iso.split("-");
  return p.length===3?p[2]+"."+p[1]+"."+p[0]:iso;
}
function daysUntil(iso){
  if(!iso) return null;
  const t=new Date();t.setHours(0,0,0,0);
  return Math.floor((new Date(iso+"T00:00:00")-t)/86400000);
}
function daysDiff(iso){
  if(!iso) return null;
  const t=new Date();t.setHours(0,0,0,0);
  return Math.floor((t-new Date(iso+"T00:00:00"))/86400000);
}
function normalizeEmails(raw){
  if(!raw) return [];
  return String(raw).split(/[;,]/).map(e=>e.trim()).filter(e=>e.includes("@"));
}
function buildLink(tedNo){
  return window.location.href.split("?")[0]+"?supplier="+encodeURIComponent(String(tedNo));
}
function esc(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function getParam(n){return new URLSearchParams(window.location.search).get(n);}
function navigate(q){window.location.href=window.location.pathname+(q?"?"+q:"");}

let _flashT;
function flash(msg, type){
  let el=document.getElementById("flash");
  if(!el){el=document.createElement("div");el.id="flash";el.style.cssText="position:fixed;top:60px;right:16px;z-index:9999;max-width:320px";document.body.appendChild(el);}
  el.innerHTML=`<div class="alert alert-${type||"ok"}" style="box-shadow:0 4px 12px rgba(0,0,0,.15)">${esc(msg)}</div>`;
  clearTimeout(_flashT);_flashT=setTimeout(()=>{el.innerHTML="";},4000);
}

function showModal(html, onClose){
  let ov=document.getElementById("modal-ov");
  if(!ov){ov=document.createElement("div");ov.id="modal-ov";ov.className="overlay";document.body.appendChild(ov);}
  ov.innerHTML=html;ov.classList.remove("hidden");
  window._closeModal=()=>{ov.classList.add("hidden");ov.innerHTML="";if(onClose)onClose();};
  ov.addEventListener("click", e=>{if(e.target===ov)window._closeModal();},{once:true});
}
function closeModal(){if(window._closeModal)window._closeModal();}

function openMailto(mailto){

}

function readExcelFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(XLSX.read(e.target.result,{type:"array",raw:true}));
    r.onerror=()=>rej(r.error);
    r.readAsArrayBuffer(file);
  });
}

function parseOrderExcel(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
  const result=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(!r||r.length<13) continue;
    const tedNo=String(r[11]||"").trim().split(".")[0];
    const talepNo=String(r[1]||"").trim();
    const strNo=String(r[2]||"").trim();
    if(!tedNo||!talepNo) continue;
    result.push({
      id:tedNo+"-"+talepNo+"-"+strNo,
      talepTipi:String(r[0]||"").trim(), talepNo, strNo,
      malzKodu:String(r[3]||"").trim(), malzTanim:String(r[4]||"").trim(),
      origQty:String(r[5]||"").trim(), bagMiktar:String(r[6]||"").trim(),
      sozTarih:serialToISO(r[9]), tedNo,
      tedUnvan:String(r[12]||"").trim(), acil:false
    });
  }
  return result;
}

function parseSupplierExcel(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
  const m={};
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r||!r[0]) continue;
    const no=String(r[0]).trim().split(".")[0];
    if(no) m[no]={tedNo:no,name:String(r[1]||"").trim(),mail:String(r[2]||"").trim()};
  }
  return m;
}

// STATUS HELPERS
function orderStatus(o, resp){
  const r=resp||{};
  const tarih=r.yeniTarih||o.sozTarih;
  const until=daysUntil(tarih);
  if(until!==null && until<0) return "gecikti";
  if(r.savedAt) return "girildi";
  return "bekliyor";
}

function supplierStatus(orders, resp){
  const statuses=orders.map(o=>orderStatus(o,resp[o.id]||{}));
  if(statuses.every(s=>s==="girildi")) return "tamamlandi";
  if(statuses.some(s=>s==="gecikti")) return "gecikti";
  if(statuses.some(s=>s==="girildi")) return "kismi";
  return "bekliyor";
}

}

    <div style="max-width:340px;width:100%;text-align:center">
      <img src="${LOGO_SRC}" style="height:36px;margin-bottom:24px">
      <div class="space-y">
        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:14px" onclick="navigate('view=dashboard')">📊 Takip Paneli</button>
        <button class="btn btn-ghost" style="width:100%;justify-content:center;padding:12px;font-size:14px;margin-top:10px;background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)" onclick="navigate('view=admin')">⚙ Admin</button>
      </div>
    </div>
  </div>`;
}
</script>

<script>
async function showSupplierGate(supplierId){
  const pwd=await getAyar("password")||"";
  if(!pwd){await showSupplierView(supplierId);return;}
  document.body.innerHTML=`
  <div class="dark-page">
    <div style="max-width:340px;width:100%">
      <div style="text-align:center;margin-bottom:24px"><img src="${LOGO_SRC}" style="height:30px"></div>
      <div style="background:#243b78;border-radius:12px;padding:24px;border:1px solid rgba(255,255,255,.1)">
        <label class="lbl" style="color:rgba(255,255,255,.6)">Erişim Şifresi</label>
        <input id="pwd-in" type="password" placeholder="Şifrenizi girin"
          style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2);margin-bottom:10px"
          onkeydown="if(event.key==='Enter')checkPwd('${esc(supplierId)}')" />
        <p id="pwd-err" class="hidden" style="color:#fca5a5;font-size:12px;margin-bottom:8px">Yanlış şifre.</p>
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="checkPwd('${esc(supplierId)}')">Giriş</button>
      </div>
    </div>
  </div>`;
}
async function checkPwd(id){
  const pwd=await getAyar("password")||"";
  if(document.getElementById("pwd-in").value===pwd) await showSupplierView(id);
  else{document.getElementById("pwd-err").classList.remove("hidden");document.getElementById("pwd-in").style.borderColor="#fca5a5";}
}
</script>

<!-- ═══════ SUPPLIER VIEW ═══════ -->
<script>
async function showSupplierView(supplierId){
  const [allOrders, responses] = await Promise.all([getOrders(), getResponses()]);
  const orders = allOrders.filter(o=>o.tedNo===supplierId);
  const tedAdi = (orders[0]&&orders[0].tedUnvan)||supplierId;
  const acil = orders.filter(o=>o.acil);
  const normal = orders.filter(o=>!o.acil);

  function rowHTML(o){
    const r=responses[o.id]||{};
    const tarih=r.yeniTarih||o.sozTarih;
    const until=daysUntil(tarih);
    const st=orderStatus(o,r);
    const isLate=st==="gecikti";
    const isDone=st==="girildi";
    return `<tr class="${isLate?"late":isDone?"done":""}" id="sup-row-${o.id}">
      <td><input type="checkbox" id="sup-chk-${o.id}"></td>
      <td>
        ${o.acil?'<span class="badge b-acil">ACİL</span> ':""}
        ${isLate?'<span class="badge b-red">Tarih Geçti</span>':""}
        ${isDone&&!isLate?'<span class="badge b-green">✓</span>':""}
      </td>
      <td class="mono">${esc(o.talepTipi)} ${esc(o.talepNo)}/${esc(o.strNo)}</td>
      <td><code style="background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:11px">${esc(o.malzKodu)}</code></td>
      <td style="max-width:200px"><div class="truncate" title="${esc(o.malzTanim)}">${esc(o.malzTanim)}</div></td>
      <td class="fw6">${esc(o.bagMiktar)}</td>
      <td>${fmtDate(o.sozTarih)}</td>
      <td>
        <input type="date" id="sup-date-${o.id}" value="${esc(r.yeniTarih||"")}" style="min-width:120px" onchange="supDateChange('${esc(o.id)}')">
        <div style="font-size:10px;color:#94A3B8;margin-top:1px">GG/AA/YYYY</div>
      </td>
      <td><input type="text" id="sup-not-${o.id}" value="${esc(r.not||"")}" placeholder="Not..." style="min-width:80px;font-size:12px"></td>
      <td>
        ${r.adminNot?`<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:4px 8px;font-size:11px;color:#92400e;min-width:100px">💬 ${esc(r.adminNot)}</div>`:'<span style="color:#CBD5E1;font-size:11px">—</span>'}
      </td>
      <td><button class="btn btn-navy btn-sm" id="sup-btn-${o.id}" onclick="supSaveRow('${esc(o.id)}')" ${!r.yeniTarih?"disabled":""}>
        ${isDone?"Güncelle":"Kaydet"}
      </button></td>
    </tr>`;
  }

  const tblHeader=`<thead><tr>
    <th style="width:30px"><input type="checkbox" onchange="supToggleAll(this.checked)"></th>
    <th></th><th>Talep</th><th>Malz. Kodu</th><th>Malzeme Tanımı</th>
    <th>Bağlanmamış</th><th>Söz Verilen</th><th>Yeni Tarih</th><th>Not</th><th>Cimtaş Notu</th><th></th>
  </tr></thead>`;

  document.body.innerHTML=`
  <header>
    <img src="${LOGO_SRC}" class="logo">
    <span style="color:rgba(255,255,255,.7);font-size:13px;font-weight:600">${esc(tedAdi)}</span>
  </header>
  <div class="page">
    <div class="max">
      ${acil.length?`
      <div style="margin-bottom:16px">
        <div style="font-size:11px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">⚠ Acil Kalemler</div>
        <div class="tbl-wrap"><table>${tblHeader}<tbody>${acil.map(rowHTML).join("")}</tbody></table></div>
      </div>`:""}
      ${normal.length?`
      <div>
        ${acil.length?'<div style="font-size:11px;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Diğer Siparişler</div>':""}
        <div class="tbl-wrap"><table>${tblHeader}<tbody>${normal.map(rowHTML).join("")}</tbody></table></div>
      </div>`:""}
      ${!orders.length?'<div class="card card-body" style="text-align:center;color:var(--lgray);padding:60px">Size ait açık sipariş bulunamadı.</div>':""}
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="supSaveSelected()">✓ Seçilenleri Kaydet</button>
        <button class="btn btn-ghost btn-sm" onclick="supSelectAll()">Tümünü Seç</button>
      </div>
    </div>
  </div>`;

  window._supOrders=orders;
  window._supResponses=responses;

  window.supDateChange=function(id){
    const v=document.getElementById("sup-date-"+id);
    const btn=document.getElementById("sup-btn-"+id);
    if(btn) btn.disabled=!v||!v.value;
  };
  window.supToggleAll=function(checked){orders.forEach(o=>{const el=document.getElementById("sup-chk-"+o.id);if(el)el.checked=checked;});};
  window.supSelectAll=function(){orders.forEach(o=>{const el=document.getElementById("sup-chk-"+o.id);if(el)el.checked=true;});};

  window.supSaveRow=async function(id){
    const dateEl=document.getElementById("sup-date-"+id);
    const notEl=document.getElementById("sup-not-"+id);
    if(!dateEl||!dateEl.value) return;
    const btn=document.getElementById("sup-btn-"+id);
    if(btn){btn.disabled=true;btn.textContent="...";}
    try{
      await saveResponse(id, dateEl.value, notEl?notEl.value:"");
      if(btn){btn.textContent="✓";btn.style.background="var(--green)";}
      const row=document.getElementById("sup-row-"+id);
      if(row){row.classList.remove("late");row.classList.add("done");}
      flash("Kaydedildi.");
    }catch(e){flash("Hata: "+e.message,"err");if(btn){btn.disabled=false;btn.textContent="Kaydet";}}
  };

  window.supSaveSelected=async function(){
    const sel=orders.filter(o=>{const el=document.getElementById("sup-chk-"+o.id);return el&&el.checked;});
    if(!sel.length){flash("Hiç satır seçilmedi.","warn");return;}
    let saved=0;
    for(const o of sel){
      const dateEl=document.getElementById("sup-date-"+o.id);
      if(dateEl&&dateEl.value){
        const notEl=document.getElementById("sup-not-"+o.id);
        await saveResponse(o.id, dateEl.value, notEl?notEl.value:"");
        const btn=document.getElementById("sup-btn-"+o.id);
        if(btn){btn.textContent="✓";btn.style.background="var(--green)";}
        const row=document.getElementById("sup-row-"+o.id);
        if(row){row.classList.remove("late");row.classList.add("done");}
        saved++;
      }
    }
    flash(saved+" satır kaydedildi.");
  };
}
</script>

<!-- ═══════ DASHBOARD ═══════ -->
<script>
let _D={orders:[],resp:{},sups:{},uploadedAt:null,pwd:"",haric:new Set(),mailLog:[],filter:"hepsi",search:""};

async function showDashboard(){
  document.body.innerHTML=`
  <header>
    <img src="${LOGO_SRC}" class="logo">
    <div class="hdr-actions">
      <button class="hdr-btn" onclick="exportAll()">⬇ Excel</button>
      <button class="hdr-btn" onclick="navigate('view=admin')">⚙ Admin</button>
    </div>
  </header>
  <div class="page">
    <div class="max">
      <div id="warn-area"></div>
      <div class="stats" id="stat-cards"></div>
      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Tedarikçi ara..." oninput="setSearch(this.value)" id="search-inp">
        </div>
        <button class="btn btn-ghost btn-sm" onclick="toggleAll(true)">Tümünü Seç</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleAll(false)">Seçimi Kaldır</button>
        <button class="btn btn-primary btn-sm" id="toplu-btn" onclick="topluMailSec()" style="display:none">✉ Seçilenlere Mail At</button>
      </div>
      <div class="card" id="sup-list"></div>
    </div>
  </div>`;

  await loadDashData();
  renderDash();
}

async function loadDashData(){
  const [orders,resp,sups,uploadedAt,pwd,haricRaw,mailLog]=await Promise.all([
    getOrders(),getResponses(),getSuppliers(),
    getAyar("uploadedAt"),getAyar("password"),getAyar("haric_tutulanlar"),getMailLog()
  ]);
  _D.orders=orders; _D.resp=resp; _D.sups=sups;
  _D.uploadedAt=uploadedAt; _D.pwd=pwd||"";
  _D.haric=new Set((haricRaw||"").split(",").map(s=>s.trim()).filter(Boolean));
  _D.mailLog=mailLog||[];
}

function getSupStats(){
  const map=new Map();
  _D.orders.forEach(o=>{
    if(_D.haric.has(o.tedNo)) return;
    if(!map.has(o.tedNo)) map.set(o.tedNo,{tedNo:o.tedNo,tedUnvan:o.tedUnvan,orders:[]});
    map.get(o.tedNo).orders.push(o);
  });
  const daysSince=daysDiff(_D.uploadedAt);
  return Array.from(map.values()).map(s=>{
    const st=supplierStatus(s.orders,_D.resp);
    const sup=_D.sups[s.tedNo]||{};
    const mailSayisi=_D.mailLog.filter(l=>l.ted_no===s.tedNo).length;
    const hatirlatmaGereken=s.orders.filter(o=>{
      const r=_D.resp[o.id]||{};
      const tarih=r.yeniTarih||o.sozTarih;
      const u=daysUntil(tarih);
      return u!==null&&u<0||(!r.savedAt&&daysSince>=2)||(u===1&&!r.savedAt);
    });
    return {...s,status:st,mail:sup.mail||"",mailSayisi,hatirlatmaGereken,daysSince};
  });
}

function renderDash(){
  const sups=getSupStats();
  const missingMail=_D.orders.filter(o=>!_D.haric.has(o.tedNo)&&!(_D.sups[o.tedNo]&&_D.sups[o.tedNo].mail)).map(o=>o.tedUnvan).filter((v,i,a)=>a.indexOf(v)===i);
  
  // WARN BANNER - eksik mail
  const warnEl=document.getElementById("warn-area");
  if(warnEl){
    warnEl.innerHTML=missingMail.length?`
    <div class="warn-banner">
      <span style="font-size:18px">⚠️</span>
      <div>
        <div class="fw7" style="color:#92400e;margin-bottom:2px">${missingMail.length} tedarikçinin mail adresi eksik</div>
        <ul>${missingMail.slice(0,5).map(n=>`<li>${esc(n)}</li>`).join("")}${missingMail.length>5?`<li>...ve ${missingMail.length-5} tane daha</li>`:""}</ul>
        <button class="btn btn-ghost btn-sm mt8" onclick="navigate('view=admin&tab=suppliers')" style="margin-top:8px">Tedarikçi Listesine Git →</button>
      </div>
    </div>`:"";
  }

  // STATS
  const totals={
    toplam:sups.length,
    tamamlandi:sups.filter(s=>s.status==="tamamlandi").length,
    gecikti:sups.filter(s=>s.status==="gecikti").length,
    bekliyor:sups.filter(s=>s.status==="bekliyor"||s.status==="kismi").length,
    hatirlatma:sups.filter(s=>s.hatirlatmaGereken.length>0&&s.status!=="tamamlandi").length
  };
  const statEl=document.getElementById("stat-cards");
  if(statEl) statEl.innerHTML=`
    <div class="stat ${_D.filter==="hepsi"?"active":""}" onclick="setFilter('hepsi')"><div class="stat-val c-navy">${totals.toplam}</div><div class="stat-lbl">Tedarikçi</div></div>
    <div class="stat ${_D.filter==="tamamlandi"?"active":""}" onclick="setFilter('tamamlandi')"><div class="stat-val c-green">${totals.tamamlandi}</div><div class="stat-lbl">Tamamlandı</div></div>
    <div class="stat ${_D.filter==="bekliyor"?"active":""}" onclick="setFilter('bekliyor')"><div class="stat-val c-amber">${totals.bekliyor}</div><div class="stat-lbl">Bekliyor</div></div>
    <div class="stat ${_D.filter==="gecikti"?"active":""}" onclick="setFilter('gecikti')"><div class="stat-val c-red">${totals.gecikti}</div><div class="stat-lbl">Gecikti</div></div>
    <div class="stat ${_D.filter==="hatirlatma"?"active":""}" onclick="setFilter('hatirlatma')"><div class="stat-val c-orange">${totals.hatirlatma}</div><div class="stat-lbl">🔔 Hatırlatma</div></div>`;

  // FILTER & SEARCH
  let filtered=sups;
  if(_D.filter==="tamamlandi") filtered=sups.filter(s=>s.status==="tamamlandi");
  else if(_D.filter==="bekliyor") filtered=sups.filter(s=>s.status==="bekliyor"||s.status==="kismi");
  else if(_D.filter==="gecikti") filtered=sups.filter(s=>s.status==="gecikti");
  else if(_D.filter==="hatirlatma") filtered=sups.filter(s=>s.hatirlatmaGereken.length>0&&s.status!=="tamamlandi");
  if(_D.search) filtered=filtered.filter(s=>s.tedUnvan.toLowerCase().includes(_D.search)||s.tedNo.includes(_D.search));

  // Öncelik sırası: gecikti > hatırlatma > bekliyor > kismi > tamamlandi
  const ORDER={gecikti:0,bekliyor:1,kismi:2,tamamlandi:3};
  filtered.sort((a,b)=>{
    if(a.hatirlatmaGereken.length&&!b.hatirlatmaGereken.length) return -1;
    if(!a.hatirlatmaGereken.length&&b.hatirlatmaGereken.length) return 1;
    return (ORDER[a.status]||9)-(ORDER[b.status]||9);
  });

  // LIST
  const listEl=document.getElementById("sup-list");
  if(!listEl) return;
  if(!filtered.length){listEl.innerHTML='<div style="padding:40px;text-align:center;color:var(--lgray)">Sonuç bulunamadı.</div>';return;}

  listEl.innerHTML=filtered.map(s=>{
    const pct=s.orders.length?Math.round(s.hatirlatmaGereken.length===0&&s.status==="tamamlandi"?100:s.orders.filter(o=>(_D.resp[o.id]||{}).savedAt).length/s.orders.length*100):0;
    const barColor=s.status==="tamamlandi"?"var(--green)":s.status==="gecikti"?"var(--red)":s.status==="kismi"?"var(--amber)":"var(--orange)";
    const stBadge=s.status==="tamamlandi"?'<span class="badge b-green">✓ Tamamlandı</span>':s.status==="gecikti"?'<span class="badge b-red">Gecikti</span>':s.status==="kismi"?'<span class="badge b-amber">Kısmi</span>':'<span class="badge b-amber">Bekliyor</span>';
    const hatNo=Math.min(s.mailSayisi+1,3);
    const gecikmisOrders=s.orders.filter(o=>orderStatus(o,_D.resp[o.id]||{})==="gecikti");

    return `
    <div class="sup-row" id="srow-${esc(s.tedNo)}" style="border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer" onclick="toggleDetail('${esc(s.tedNo)}')">
        <input type="checkbox" id="schk-${esc(s.tedNo)}" onclick="event.stopPropagation()" onchange="updateTopluBtn()">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">
            <span class="fw6 truncate" style="max-width:260px">${esc(s.tedUnvan)}</span>
            ${stBadge}
            ${s.hatirlatmaGereken.length&&s.status!=="tamamlandi"?`<span class="badge b-orange">🔔 ${s.hatirlatmaGereken.length} kalem</span>`:""}
            ${s.mailSayisi>0?`<span class="badge b-gray text-xs">${s.mailSayisi}. hatırlatma yapıldı</span>`:""}
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <div class="prog" style="width:100px"><div class="prog-bar" style="width:${pct}%;background:${barColor}"></div></div>
            <span class="text-xs" style="color:var(--lgray)">${s.orders.filter(o=>(_D.resp[o.id]||{}).savedAt).length}/${s.orders.length}</span>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0" onclick="event.stopPropagation()">
          ${s.mail?`
          <button class="btn btn-ghost btn-sm" onclick="sendMail('${esc(s.tedNo)}','${esc(s.tedUnvan)}','${esc(s.mail)}','hatirlatma',${hatNo},null)" title="${hatNo}. hatırlatma">
            ✉ ${s.mailSayisi>0?"Hatırlatma":"Mail At"}
          </button>`:'<span class="text-xs" style="color:var(--lgray)">Mail yok</span>'}
          ${gecikmisOrders.length&&s.mail?`<button class="btn btn-red btn-sm" onclick="sendMail('${esc(s.tedNo)}','${esc(s.tedUnvan)}','${esc(s.mail)}','gecikme',1,${JSON.stringify(gecikmisOrders.map(o=>({malzKodu:o.malzKodu,malzTanim:o.malzTanim,sozTarih:o.sozTarih}))).replace(/"/g,"&quot;")})">⚠ Gecikme</button>`:""}
        </div>
        <span id="chev-${esc(s.tedNo)}" style="color:var(--lgray);font-size:12px;margin-left:4px">▶</span>
      </div>
      <div id="sdetail-${esc(s.tedNo)}" class="hidden" style="background:#FAFBFF;border-top:1px solid var(--border);padding:12px 14px">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>Talep</th><th>Malz. Kodu</th><th>Malzeme</th><th>Bağlanmamış</th><th>Söz Verilen</th><th>Yeni Tarih</th><th>Not</th><th>Cevap</th><th>Durum</th>
            </tr></thead>
            <tbody>
              ${s.orders.map(o=>{
                const r=_D.resp[o.id]||{};
                const st2=orderStatus(o,r);
                const tarih=r.yeniTarih||o.sozTarih;
                const u=daysUntil(tarih);
                const d=st2==="gecikti"?'<span class="badge b-red">Gecikmiş</span>':st2==="girildi"?'<span class="badge b-green">✓ Girildi</span>':'<span class="badge b-amber">Bekliyor</span>';
                return `<tr class="${st2==="gecikti"?"late":st2==="girildi"?"done":""}">
                  <td class="mono">${esc(o.talepTipi)} ${esc(o.talepNo)}/${esc(o.strNo)}</td>
                  <td class="mono">${esc(o.malzKodu)}</td>
                  <td class="truncate" style="max-width:180px">${esc(o.malzTanim)}</td>
                  <td>${esc(o.bagMiktar)}</td>
                  <td>${fmtDate(o.sozTarih)}</td>
                  <td class="fw6">${r.yeniTarih?fmtDate(r.yeniTarih):"—"}</td>
                  <td style="max-width:100px;color:var(--gray)">${esc(r.not||"—")}</td>
                  <td>
                    ${r.adminNot?`<span style="font-size:11px;color:#92400e">💬 ${esc(r.adminNot)}</span> `:""}
                    <button class="btn btn-ghost btn-sm" style="font-size:10px;padding:3px 7px" onclick="yazAdminNot('${esc(o.id)}','${esc(r.adminNot||"")}')">✏ Cevap</button>
                  </td>
                  <td>${d}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
        ${s.orders.filter(o=>o.acil).length?`<div class="mt8"><button class="btn btn-primary btn-sm" onclick="sendMail('${esc(s.tedNo)}','${esc(s.tedUnvan)}','${esc(s.mail)}','acil',1,${JSON.stringify(s.orders.filter(o=>o.acil).map(o=>({malzKodu:o.malzKodu,malzTanim:o.malzTanim}))).replace(/"/g,"&quot;")})">🚨 Acil Kalemlere Mail</button></div>`:""}
      </div>
    </div>`;
  }).join("");

  window.toggleDetail=function(tedNo){
    const d=document.getElementById("sdetail-"+tedNo);
    const c=document.getElementById("chev-"+tedNo);
    if(!d) return;
    const h=d.classList.toggle("hidden");
    if(c) c.textContent=h?"▶":"▼";
  };
}

window.setFilter=function(f){_D.filter=f;renderDash();};
window.setSearch=function(q){_D.search=q.toLowerCase();renderDash();};
window.toggleAll=function(checked){document.querySelectorAll("[id^='schk-']").forEach(el=>el.checked=checked);updateTopluBtn();};
window.updateTopluBtn=function(){
  const any=Array.from(document.querySelectorAll("[id^='schk-']:checked")).length>0;
  const btn=document.getElementById("toplu-btn");
  if(btn) btn.style.display=any?"":"none";
};

window.sendMail=async function(tedNo, tedUnvan, mail, tip, hatNo, kalemlerJson){
  const link=buildLink(tedNo);
  const kalemler=kalemlerJson?JSON.parse(kalemlerJson.replace(/&quot;/g,'"')):null;
  const {subj,body}=buildMail(tedUnvan,tip,link,_D.pwd,hatNo,kalemler);
  const emails=normalizeEmails(mail);
  if(!emails.length){flash("Mail adresi yok.","warn");return;}
  showMailPreview(emails.join("; "),subj,body,async()=>{
    openMailto("mailto:"+emails.join(";")+`?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`);
    await logMail(tedNo,tedUnvan,tip,hatNo||1);
    flash("Mail gönderildi.");
    await loadDashData();
    renderDash();
  });
};

window.topluMailSec=function(){
  const secili=Array.from(document.querySelectorAll("[id^='schk-']:checked")).map(el=>el.id.replace("schk-",""));
  if(!secili.length){flash("Hiç seçilmedi.","warn");return;}
  const sups=getSupStats();
  const hedefler=sups.filter(s=>secili.includes(s.tedNo)&&s.mail);
  if(!hedefler.length){flash("Seçili tedarikçilerin mail adresi yok.","warn");return;}
  let idx=0;
  function next(){
    if(idx>=hedefler.length){flash(hedefler.length+" mail gönderildi.");loadDashData().then(renderDash);return;}
    const s=hedefler[idx++];
    const link=buildLink(s.tedNo);
    const hatNo=Math.min(s.mailSayisi+1,3);
    const {subj,body}=buildMail(s.tedUnvan,"hatirlatma",link,_D.pwd,hatNo,null);
    const emails=normalizeEmails(s.mail);
    openMailto("mailto:"+emails.join(";")+`?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`);
    logMail(s.tedNo,s.tedUnvan,"hatirlatma",hatNo);
    setTimeout(next,1800);
  }
  next();
};

window.exportAll=function(){
  const headers=["Talep Tipi","Talep No","Str No","JDE Malz. Kodu","Malzeme Tanımı","Orig. Qty","Bağlanmamış","Söz Verilen","Yeni Tarih","Not","Tedarikçi No","Tedarikçi Ünvan","Durum"];
  const data=[headers,..._D.orders.map(o=>{
    const r=_D.resp[o.id]||{};
    const st=orderStatus(o,r);
    const d=st==="gecikti"?"Gecikmiş":st==="girildi"?"Girildi":"Bekliyor";
    return[o.talepTipi,o.talepNo,o.strNo,o.malzKodu,o.malzTanim,o.origQty,o.bagMiktar,fmtDate(o.sozTarih),r.yeniTarih?fmtDate(r.yeniTarih):"",r.not||"",o.tedNo,o.tedUnvan,d];
  })];
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(data,{raw:false});
  ["H","I"].forEach(col=>{for(let row=1;row<data.length;row++){const a=col+(row+1);if(ws[a])ws[a].t="s";}});
  ws["!cols"]=[8,10,8,14,30,10,14,14,14,20,10,30,10].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws,"Teslim Takip");
  XLSX.writeFile(wb,"Teslim_Takip_"+new Date().toISOString().slice(0,10)+".xlsx");
};

<script>
let _adminTab="orders";

async function showAdmin(){

async function renderAdminTab(tab){

// ORDERS ADMIN
async function renderOrdersAdmin(el){
  const orders=await getOrders();
  const groups={};
  orders.forEach(o=>{if(!groups[o.tedNo])groups[o.tedNo]={n:o.tedUnvan,c:0};groups[o.tedNo].c++;});

  el.innerHTML=`
  <div class="card card-body mb16">
    <div class="fw7" style="font-size:15px;margin-bottom:4px">Açık Sipariş Listesi Yükle</div>
    <div class="text-xs" style="color:var(--lgray);margin-bottom:16px">A=Talep Tipi · B=Talep No · C=Str No · D=Malz.Kodu · E=Tanım · F=Orig.Qty · G=Bağlanmamış · J=Söz Verilen · L=Ted.No · M=Ted.Ünvan</div>
    <div class="upload-zone" onclick="document.getElementById('order-file').click()">
      <div style="font-size:32px;margin-bottom:8px">📂</div>
      <div class="fw6">Excel dosyası seç veya buraya sürükle</div>
      <div class="text-xs" style="color:var(--lgray);margin-top:4px">.xlsx veya .xls — Tedarikçi yanıtları korunur</div>
      <input type="file" id="order-file" accept=".xlsx,.xls" style="display:none" onchange="handleOrderFile(this)">
    </div>
    <div id="order-preview" class="hidden mt12"></div>
  </div>
  ${Object.keys(groups).length?`
  <div class="card">
    <div class="card-body" style="padding-bottom:8px"><span class="fw7">Tedarikçi Linkleri</span></div>
    ${Object.entries(groups).map(([no,g])=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px">
      <div><span class="fw6 text-sm">${esc(g.n)}</span><span class="text-xs" style="color:var(--lgray);margin-left:8px">${g.c} satır</span></div>
      <button class="btn btn-ghost btn-sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(buildLink(no))}');flash('Kopyalandı.')">📋 Linki Kopyala</button>
    </div>`).join("")}
  </div>`:""}`;

  window.handleOrderFile=async function(input){
    const file=input.files[0];if(!file) return;
    const prev=document.getElementById("order-preview");
    prev.innerHTML='<div class="alert alert-info">Okunuyor...</div>';
    prev.classList.remove("hidden");
    try{
      const wb=await readExcelFile(file);
      const result=parseOrderExcel(wb);
      if(!result.length){prev.innerHTML='<div class="alert alert-err">Veri okunamadı. Sütun sırası doğru mu?</div>';return;}
      window._pendingOrders=result;
      prev.innerHTML=`
      <div class="card card-body">
        <div class="fw7 mb8">Önizleme — ${result.length} satır</div>
        <div class="tbl-wrap mb12">
          <table><thead><tr><th>Tedarikçi</th><th>Talep</th><th>Malz.Kodu</th><th>Malzeme</th><th>Söz Verilen</th></tr></thead>
          <tbody>${result.slice(0,6).map(r=>`<tr>
            <td>${esc(r.tedUnvan)}</td><td class="mono">${esc(r.talepTipi)} ${esc(r.talepNo)}/${esc(r.strNo)}</td>
            <td class="mono">${esc(r.malzKodu)}</td><td style="max-width:160px" class="truncate">${esc(r.malzTanim)}</td><td>${fmtDate(r.sozTarih)}</td>
          </tr>`).join("")}${result.length>6?`<tr><td colspan="5" style="color:var(--lgray)">...${result.length-6} satır daha</td></tr>`:""}</tbody></table>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
          <span class="text-xs" style="color:var(--lgray)">Mevcut sipariş listesi değişecek. Yanıtlar korunacak.</span>
          <button class="btn btn-primary" onclick="doSaveOrders()">💾 ${result.length} satırı kaydet</button>
        </div>
      </div>`;
    }catch(e){prev.innerHTML=`<div class="alert alert-err">Hata: ${esc(e.message)}</div>`;}
  };

  window.doSaveOrders=async function(){
    const rows=window._pendingOrders;if(!rows||!rows.length) return;
    const btn=document.querySelector("[onclick='doSaveOrders()']");
    if(btn){btn.disabled=true;btn.textContent="Kaydediliyor...";}
    try{
      await uploadOrders(rows);
      flash(rows.length+" satır kaydedildi.");
      window._pendingOrders=null;
      await renderOrdersAdmin(document.getElementById("admin-content"));
    }catch(e){flash("Hata: "+e.message,"err");if(btn){btn.disabled=false;btn.textContent="Kaydet";}}
  };
}

// ACIL ADMIN
async function renderAcilAdmin(el){
  const orders=await getOrders();
  if(!orders.length){el.innerHTML='<div class="card card-body" style="text-align:center;color:var(--lgray)">Önce sipariş yükleyin.</div>';return;}
  const groups=new Map();
  orders.forEach(o=>{if(!groups.has(o.tedNo))groups.set(o.tedNo,{n:o.tedUnvan,orders:[]});groups.get(o.tedNo).orders.push(o);});

  el.innerHTML=`
  <div class="fw7 mb12" style="font-size:15px">Acil Kalemler</div>
  <div class="text-xs mb16" style="color:var(--lgray)">İşaretlenen kalemler tedarikçi formunda ACİL rozeti ile en üstte gösterilir.</div>
  <div class="search-box mb12" style="max-width:400px">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Malzeme kodu veya tanım ara..." oninput="filterAcil(this.value)">
  </div>
  <div class="space-y" id="acil-list">
    ${Array.from(groups.entries()).map(([tedNo,g])=>`
    <div class="card" id="acilg-${esc(tedNo)}">
      <div style="padding:10px 14px;background:#F8FAFC;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
        <span class="fw7 text-sm">${esc(g.n)}</span>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--gray)">
          <input type="checkbox" onchange="toggleTedAcil('${esc(tedNo)}',this.checked)" ${g.orders.every(o=>o.acil)?"checked":""}>Tümü
        </label>
      </div>
      ${g.orders.map(o=>`
      <label class="acil-item" data-s="${esc((o.malzKodu+" "+o.malzTanim).toLowerCase())}"
        style="display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;border-top:1px solid var(--border)"
        onmouseenter="this.style.background='#fffaf8'" onmouseleave="this.style.background=''">
        <input type="checkbox" id="acil-${esc(o.id)}" ${o.acil?"checked":""} onchange="setAcil('${esc(o.id)}',this.checked)">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
            <code style="background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:11px">${esc(o.malzKodu)}</code>
            ${o.acil?'<span class="badge b-acil">ACİL</span>':""}
          </div>
          <div class="text-sm truncate">${esc(o.malzTanim)}</div>
          <div class="mono text-xs" style="color:var(--lgray)">${esc(o.talepTipi)} ${esc(o.talepNo)}/${esc(o.strNo)} · ${esc(o.bagMiktar)}</div>
        </div>
      </label>`).join("")}
    </div>`).join("")}
  </div>`;

  window.filterAcil=function(q){
    q=q.toLowerCase();
    document.querySelectorAll(".acil-item").forEach(item=>{item.style.display=!q||item.dataset.s.includes(q)?"":"none";});
    document.querySelectorAll("[id^='acilg-']").forEach(g=>{
      g.style.display=Array.from(g.querySelectorAll(".acil-item")).some(i=>i.style.display!=="none")?"":"none";
    });
  };
  window.toggleTedAcil=async function(tedNo,checked){
    const items=document.querySelectorAll(`[id^='acil-'][id$='']`);
    for(const o of orders.filter(o=>o.tedNo===tedNo)){
      const el=document.getElementById("acil-"+o.id);if(el) el.checked=checked;
      try{await setAcil(o.id,checked);}catch(e){}
    }
    flash("Kaydedildi.");
  };
}

// SUPPLIERS ADMIN
async function renderSuppliersAdmin(el){
  const smap=await getSuppliers();
  const list=Object.values(smap).sort((a,b)=>(a.name||"").localeCompare(b.name||"","tr"));

  el.innerHTML=`
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">

    </div>
  </div>
  <div class="search-box mb8" style="max-width:400px">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Tedarikçi ara..." oninput="filterSups(this.value)">
  </div>
  <div class="card" id="sup-tbl">
    ${!list.length?'<div style="padding:32px;text-align:center;color:var(--lgray)">Liste boş.</div>':
      list.map(s=>`
      <div class="sup-admin-row" data-s="${esc((s.tedNo+" "+(s.name||"")).toLowerCase())}"
        style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--border)" id="sarow-${esc(s.tedNo)}">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px">
            <span class="mono text-xs" style="color:var(--lgray)">${esc(s.tedNo)}</span>
            <span class="fw6 text-sm truncate">${esc(s.name)}</span>

        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="btn btn-ghost btn-sm" onclick="editSup('${esc(s.tedNo)}','${esc(s.name)}','${esc(s.mail)}')">✏</button>

      <button class="btn btn-ghost btn-sm" onclick="renderSuppliersAdmin(document.getElementById('admin-content'))">✕</button>
    </div>`;
  };
  window.saveSup=async function(no){
    try{await upsertSupplier(no,document.getElementById("en-"+no).value.trim(),document.getElementById("em-"+no).value.trim());flash("Güncellendi.");await renderSuppliersAdmin(document.getElementById("admin-content"));}
    catch(e){flash("Hata: "+e.message,"err");}
  };
  window.delSup=async function(no){
    if(!confirm("Silinsin mi?")) return;
    try{await deleteSupplier(no);flash("Silindi.");await renderSuppliersAdmin(document.getElementById("admin-content"));}
    catch(e){flash("Hata: "+e.message,"err");}
  };
  window.handleSupFile=async function(input){
    const file=input.files[0];if(!file) return;
    try{
      const wb=await readExcelFile(file);
      const parsed=parseSupplierExcel(wb);
      for(const s of Object.values(parsed)) await upsertSupplier(s.tedNo,s.name,s.mail);
      flash(Object.keys(parsed).length+" tedarikçi yüklendi.");
      input.value="";
      await renderSuppliersAdmin(document.getElementById("admin-content"));
    }catch(e){flash("Hata: "+e.message,"err");}
  };
}

      <label class="haric-item" data-s="${esc((no+" "+unvan).toLowerCase())}"

    <div style="display:flex;align-items:center;gap:12px;margin-top:10px">
      <button class="btn btn-primary btn-sm" onclick="saveHaric()">💾 Kaydet</button>
      <span class="text-xs" style="color:var(--lgray)" id="haric-count">${haric.length} tedarikçi hariç</span>

  window.savePwd=async function(){await setAyar("password",document.getElementById("pwd-set").value.trim());flash("Şifre kaydedildi.");};
  window.filterHaric=function(q){
    q=q.toLowerCase();
    document.querySelectorAll(".haric-item").forEach(i=>{i.style.display=!q||i.dataset.s.includes(q)?"":"none";});
  };
  window.saveHaric=async function(){
    const sel=Array.from(document.querySelectorAll("[id^='h-']:checked")).map(el=>el.id.replace("h-",""));
    await setAyar("haric_tutulanlar",sel.join(","));
    const cnt=document.getElementById("haric-count");
    if(cnt) cnt.textContent=sel.length+" tedarikçi hariç";
    flash(sel.length+" tedarikçi hariç tutuldu.");
  };
}
</script>
